version: "3.8"
services:
  dieren-adoptie-mongo:
    image: mongo:6.0.5
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=dieren-adoptie-user
      - MONGO_INITDB_ROOT_PASSWORD=dieren-adoptie-password
      - MONGO_INITDB_DATABASE=dieren-adoptie
    ports:
      - "27117:27017"
    volumes:
      - dieren_adoptie_mongo_volume:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
volumes:
  dieren_adoptie_mongo_volume:
